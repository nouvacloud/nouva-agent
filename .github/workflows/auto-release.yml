name: Auto Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      sha:
        description: Exact public repository commit to release
        required: true
        type: string

concurrency:
  group: auto-agent-release-${{ inputs.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve agent release
        id: version
        env:
          RELEASE_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
        run: |
          node <<'EOF'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("agent/package.json", "utf8"));
          if (typeof pkg.version !== "string" || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(pkg.version)) {
            throw new Error(`Invalid agent package version: ${String(pkg.version)}`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${pkg.version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${process.env.RELEASE_SHA}\n`);
          EOF

      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')"
            if [ "${is_draft}" = "true" ]; then
              target="$(gh release view "${RELEASE_TAG}" --json targetCommitish --jq '.targetCommitish')"
              if [ "${target}" != "${RELEASE_SHA}" ]; then
                echo "Draft ${RELEASE_TAG} targets ${target}, expected ${RELEASE_SHA}." >&2
                exit 1
              fi

              echo "dispatch=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            released_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [ "${released_sha}" != "${RELEASE_SHA}" ]; then
              echo "${RELEASE_TAG} already points to ${released_sha}; bump agent/package.json." >&2
              exit 1
            fi

            echo "dispatch=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} exists without a GitHub Release." >&2
            exit 1
          fi

          gh release create "${RELEASE_TAG}" \
            --target "${RELEASE_SHA}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --draft
          echo "dispatch=true" >> "${GITHUB_OUTPUT}"

      - name: Dispatch image publication
        if: steps.release.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run release.yml \
            --ref main \
            -f tag="${RELEASE_TAG}" \
            -f sha="${RELEASE_SHA}"
